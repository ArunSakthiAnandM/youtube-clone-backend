# MongoDB Configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ytclone}

# Amazon S3 Credentials - USE ENVIRONMENT VARIABLES
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.region.static=${AWS_REGION:ap-south-1}
spring.cloud.aws.stack.auto=false

s3.bucket.name=${S3_BUCKET_NAME:project.ytclone}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# Auth0 Configuration - USE ENVIRONMENT VARIABLES
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE:http://localhost:8080}
auth0.userinfoEndpoint=${AUTH0_USERINFO_ENDPOINT}